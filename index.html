h2{margin:4px 0;font-size:clamp(17px,5vw,24px);color:#ffd166}
h3{margin:6px 0;font-size:clamp(14px,4vw,18px);color:#5ee7ff}
p{max-width:440px;line-height:1.45;margin:8px 0;font-size:16px}

#mission code{color:#ffd166;font-weight:700;word-break:break-all}

.d{position:absolute;font-size:clamp(28px,8vw,46px);translate:-50% -50%;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.c{position:absolute;translate:-50% -50%;padding:6px 8px 5px;border-top:5px solid var(--t,#4a7bd1);background:rgba(247,246,240,.94);color:#16222e;border-radius:2px;font:700 12px/1 Arial,Helvetica,sans-serif;letter-spacing:1.2px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.5);cursor:pointer}
.c.f{background:#d6f2dd;border-top-color:#1fa971;animation:ok .6s}
.c.w{border-color:#e76f51;animation:sk .35s}

@keyframes ok{50%{scale:1.4}}
@keyframes sk{25%{translate:calc(-50% - 6px) -50%}75%{translate:calc(-50% + 6px) -50%}}

@keyframes bn{from{scale:.3;opacity:0}to{scale:1;opacity:1}}
.ep{background:rgba(255,255,255,.1);border:1px solid #ffd166;border-radius:12px;padding:8px 12px;margin:5px 0;font-size:13px;max-width:92vw;word-break:break-all}
.ep b{color:#ffd166;font-family:ui-monospace,Menlo,monospace}

.gar::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#c1121f 0 3px,transparent 4px) 6px 8px/54px 14px repeat-x,radial-gradient(circle,#ffd166 0 3px,transparent 4px) 33px 8px/54px 14px repeat-x}

.orn::before{content:"";position:absolute;left:50%;bottom:100%;width:1px;height:var(--h);background:#d9c27a}

<script>
// ============ EDITABLE RESEARCH DATA (change only this section) ============

function build(){
  lab.innerHTML=DECO;
  const cells=[];for(let r=0;r<7;r++)for(let c=0;c<4;c++)cells.push([c,r]);shuf(cells);
  let i=0;
  const put=e=>{const[c,r]=cells[i++];e.style.left=((c+.5)/4*100+(R()-.5)*7)+'%';e.style.top=((r+.5)/7*100+(R()-.5)*5)+'%';lab.appendChild(e)};
  shuf(DECOR.slice()).forEach(d=>{const e=document.createElement('div');e.className='d';e.textContent=d;e.style.rotate=(R()*50-25)+'deg';put(e)});
  shuf(TG.concat(CONFIG.DISTRACTORS)).forEach(w=>{const e=document.createElement('div');e.className='c';e.textContent=w;e.style.rotate=(R()*8-4)+'deg';e.style.setProperty('--t',['#e63946','#2a9d8f','#f4b400','#4a7bd1','#9b5de5'][Math.floor(R()*5)]);e.onclick=()=>pick(e,w);put(e)});
}
function pick(e,w){
  if(ended||e.classList.contains('f'))return;
  if(TG.includes(w)){e.classList.add('f');found++;score+=100;upd();chime(found);toast(found<2?'One peptide discovered! Keep going!':'');if(found==2)win()}
  else{e.classList.add('w');setTimeout(()=>e.classList.remove('w'),400);toast('Not this one! Keep searching.')}
}
function start(){
  stopAnim();clearInterval(tick);
  found=0;score=0;left=CONFIG.TIME_SECONDS;hintUsed=false;ended=false;
  ['startScr','goScr','winScr','banner'].forEach(i=>show(i,false));
  $('game').style.display='flex';
  build();upd();
  tick=setInterval(()=>{left--;upd();if(left<=0){clearInterval(tick);ended=true;show('goScr')}},1000);
}
$('go').onclick=start;$('again1').onclick=start;$('again2').onclick=start;$('rst').onclick=start;
$('hint').onclick=()=>{
  if(hintUsed||ended)return;
  const c=[...lab.querySelectorAll('.c:not(.f)')].find(e=>TG.includes(e.textContent));if(!c)return;
  hintUsed=true;score=Math.max(0,score-20);upd();c.classList.add('h');setTimeout(()=>c.classList.remove('h'),2600);toast('Hint used (−20 points)');
};
function win(){
  clearInterval(tick);ended=true;
  const used=CONFIG.TIME_SECONDS-left;score+=left*3;upd();
  $('e1').textContent=TG[0];$('e2').textContent=TG[1];
  $('res').textContent='Final score: '+score+' · Completion time: '+used+' s';
  $('who').textContent=CONFIG.NAME+' • '+CONFIG.INSTITUTE+' • Come and chat at my poster!';
  show('banner');
  setTimeout(()=>{show('banner',false);$('game').style.display='none';begin()},1600);
}

// ---------- sound ----------
let ac;
function chime(n){try{
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  const f=n==2?[523,659,784,1047]:[660,880];
  f.forEach((q,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+i*.12;
    o.type='sine';o.frequency.value=q;g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.5);
    o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+.55)});
}catch(e){}}

// ---------- victory animation (2D canvas, light for phones) ----------
const stars=Array.from({length:50},()=>[R(),R(),R()+.4]);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ea=x=>x*x*(3-2*x);
function rr(c,x,y,w,h,r,f){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=f;c.fill()}
function txt(c,s,x,y,col,sz,al){c.fillStyle=col;c.font='700 '+sz+'px system-ui';c.textAlign=al||'center';c.fillText(s,x,y)}
function begin(){mol.style.display='block';$('cap').style.display='block';size();t0=performance.now();anim=true;shown=false;P=[];requestAnimationFrame(loop)}
function stopAnim(){anim=false;mol.style.display='none';$('cap').style.display='none';P=[];fc.setTransform(1,0,0,1,0,0);fc.clearRect(0,0,fx.width,fx.height)}
function caption(t){const m=t<2.5?'1) SLA-I (swine MHC class I) presents the peptide in its binding groove.':t<5.5?'2) The peptide–SLA-I complex approaches the T-cell surface…':'';if($('cap').textContent!==m)$('cap').textContent=m;$('cap').style.display=m?'block':'none'}
function draw(t){
  const c=mc;c.setTransform(D,0,0,D,0,0);
  const g=c.createRadialGradient(W/2,H*.4,10,W/2,H*.4,Math.max(W,H));g.addColorStop(0,'#16286a');g.addColorStop(1,'#02040f');c.fillStyle=g;c.fillRect(0,0,W,H);
  stars.forEach(s=>{c.globalAlpha=.3+.3*Math.sin(t*2+s[2]*9);c.fillStyle='#bfe9ff';c.beginPath();c.arc(s[0]*W,((s[1]+t*.01*s[2])%1)*H,s[2]*1.6,0,7);c.fill()});c.globalAlpha=1;
  const s=Math.min(W/380,H*.86/540);
  c.save();c.translate(W/2,H*.8);c.scale(s,s);
  const ta=cl((t-1.5)/1),a=ea(cl((t-2.8)/3)),oy=130*(1-a),ty=-310,gl=cl((t-5.8)/1.5),pu=1+.08*Math.sin(t*5);
  const ey=x=>ty+Math.sqrt(25600-x*x);
  c.globalAlpha=ta;
  c.save();c.shadowColor='#ffd166';c.shadowBlur=70*gl;
  const tg=c.createRadialGradient(0,ty-30,10,0,ty,160);tg.addColorStop(0,'#c9a8ff');tg.addColorStop(1,'#5b3aa8');
  c.fillStyle=tg;c.beginPath();c.arc(0,ty,160,0,7);c.fill();c.restore();
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.arc(-20,ty-40,60,0,7);c.fill();
  txt(c,'CD8+ T cell',0,ty,'#fff',22);
  c.lineCap='round';c.strokeStyle='#f1e6ff';c.lineWidth=8;c.beginPath();c.arc(0,ty,160,.3,Math.PI-.3);c.stroke();
  c.strokeStyle='#8a63d8';c.lineWidth=3;c.beginPath();c.arc(0,ty,154,.3,Math.PI-.3);c.stroke();
  if(gl>0){c.strokeStyle='rgba(255,209,102,'+gl*.8+')';c.lineWidth=5;c.beginPath();c.arc(0,ty,168,0,7);c.stroke()}
  // TCR anchored in the T-cell membrane
  c.strokeStyle='#5ee7ff';c.lineWidth=9;
  [-14,6].forEach(x=>{c.beginPath();c.moveTo(x,ey(x));c.lineTo(x,-92);c.stroke()});
  c.lineWidth=11;c.beginPath();c.moveTo(-34,-68);c.quadraticCurveTo(-10,-102,18,-68);c.stroke();
  c.fillStyle='#5ee7ff';[-14,6].forEach(x=>{c.beginPath();c.ellipse(x,ey(x),8,13,0,0,7);c.fill()});
  // CD8 co-receptor anchored in the membrane, reaching SLA-I alpha3
  c.strokeStyle='#ff6bd6';c.lineWidth=8;
  [[84,100],[98,114]].forEach(([x,e])=>{c.beginPath();c.moveTo(x,ey(x));c.bezierCurveTo(x,-80,e+8,-20+oy*.5,e,26+oy);c.stroke()});
  c.fillStyle='#ff6bd6';[84,98].forEach(x=>{c.beginPath();c.ellipse(x,ey(x),8,13,0,0,7);c.fill()});
  c.globalAlpha=1;
  // SLA-I + peptide approach the T-cell surface
  c.save();c.translate(0,oy);
  c.fillStyle='#ff6bd6';c.beginPath();c.ellipse(108,34,15,12,0,0,7);c.fill();
  c.fillStyle='#b497ff';c.beginPath();c.ellipse(-52,40,34,24,0,0,7);c.fill();txt(c,'β2m',-52,45,'#2a1a66',12);
  rr(c,-20,10,112,56,14,'#7b5cd6');txt(c,'α3',36,44,'#fff',14);
  rr(c,-92,-26,184,38,12,'#1fb5a8');
  rr(c,-92,-44,40,17,8,'#5ff0dd');rr(c,52,-44,40,17,8,'#5ff0dd');
  c.save();c.shadowColor='#ffd166';c.shadowBlur=14*pu;
  c.strokeStyle='#ff9ecb';c.lineWidth=4;c.beginPath();
  for(let k=0;k<9;k++){const x=-44+k*11,y=-40+(k%2?-3:3);k?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
  for(let k=0;k<9;k++){c.fillStyle=k%3==0?'#ffd166':'#ff9ecb';c.beginPath();c.arc(-44+k*11,-40+(k%2?-3:3),6*pu,0,7);c.fill()}
  c.restore();
  txt(c,'SLA-I',-98,3,'#bfe9ff',19,'right');
  c.restore();
  if(t>5.8){const f=cl((t-5.8)/1);c.globalAlpha=f;txt(c,'TCR',-62,-125,'#5ee7ff',16);txt(c,'CD8',128,-40,'#ff6bd6',16);
    const q=.5+.5*Math.sin(t*6);c.fillStyle='rgba(255,209,102,'+(.25+.35*q)*f+')';c.beginPath();c.arc(-8,-62,18+10*q,0,7);c.fill();c.globalAlpha=1}
  c.restore();
  caption(t);
}
// golden glitter + sparkling stars
let S=[];
function fxStep(on){
  const c=fc;c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,W,H);
  if(!S.length)for(let i=0;i<70;i++)S.push({x:R()*W,y:R()*H,r:1+R()*2.5,v:.4+R()*.9,p:R()*9});
  c.fillStyle='rgba(255,255,255,.75)';S.forEach(f=>{f.y+=f.v;f.x+=Math.sin(f.p+=.02)*.4;if(f.y>H){f.y=-5;f.x=R()*W}c.beginPath();c.arc(f.x,f.y,f.r,0,7);c.fill()});
  const cols=['#ffd166','#ffe9a3','#f4b400','#fff3c4','#dfe6ea','#c0c8cf'];
  if(on&&P.length<420)for(let i=0;i<5;i++)P.push({x:R()*W,y:-10,vx:(R()-.5)*1.2,vy:1.5+R()*2.5,s:2+R()*4,r:R()*6,vr:(R()-.5)*.2,c:cols[Math.floor(R()*6)],k:R()<.2,p:R()*9});
  P=P.filter(p=>p.y<H+10);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.p+=.2;
    c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=.55+.45*Math.sin(p.p);c.fillStyle=p.c;
    if(p.k){const s=p.s;c.beginPath();c.moveTo(0,-2*s);c.lineTo(.5*s,-.5*s);c.lineTo(2*s,0);c.lineTo(.5*s,.5*s);c.lineTo(0,2*s);c.lineTo(-.5*s,.5*s);c.lineTo(-2*s,0);c.lineTo(-.5*s,-.5*s);c.fill()}
    else c.fillRect(-p.s,-p.s/2,p.s*2,p.s);
    c.restore()});
}
(function sl(){fxStep(anim&&performance.now()-t0>6000);requestAnimationFrame(sl)})();
function loop(now){
  if(!anim)return;
  const t=(now-t0)/1000;draw(t);
  if(t>10&&!shown){shown=true;chime(2);show('winScr')}
  requestAnimationFrame(loop);
}
</script>
